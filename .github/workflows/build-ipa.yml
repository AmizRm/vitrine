name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      use_alt_name:
        description: "Name it as a TestFlight build"
        default: false
        type: boolean
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
      upload_release:
        description: "Also publish both IPAs as a GitHub release"
        default: true
        type: boolean
      release_notes:
        description: "Extra text for the release description"
        default: ""
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Mask IPA link
        run: |
          URL="$(jq -r '.inputs.ipa_url // empty' "$GITHUB_EVENT_PATH")"
          [ -z "$URL" ] || echo "::add-mask::$URL"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download IPA and install tools
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -eo pipefail
          JOBS="$RUNNER_TEMP/jobs"; : > "$JOBS"

          bg() {
            local name="$1"; shift
            ( "$@" ) > "$RUNNER_TEMP/$name.log" 2>&1 &
            echo "$! $name" >> "$JOBS"
          }

          fetch_ipa() {
            mkdir -p ipa
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$IPA_URL" -o ipa/spotify.ipa
            case "$(file --mime-type -b ipa/spotify.ipa)" in
              application/zip|application/x-ios-app) ;;
              *) echo "::error::Not an IPA"; return 1 ;;
            esac
          }

          install_brew() {
            brew install --quiet make dpkg ldid
          }

          install_cyan() {
            python3 -m pip install --quiet --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          }

          install_ipapatch() {
            local suffix=macos-arm64
            [ "$(uname -m)" = "x86_64" ] && suffix=macos-amd64
            sudo curl -fsSL --retry 3 \
              "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${suffix}" \
              -o /usr/local/bin/ipapatch
            sudo chmod +x /usr/local/bin/ipapatch
          }

          bg ipa      fetch_ipa
          bg brew     install_brew
          bg cyan     install_cyan
          bg ipapatch install_ipapatch

          failed=0
          while read -r pid name; do
            if wait "$pid"; then
              echo "::group::$name ok"
            else
              echo "::group::$name FAILED"; failed=1
            fi
            cat "$RUNNER_TEMP/$name.log"
            echo "::endgroup::"
          done < "$JOBS"

          [ "$failed" -eq 0 ] || { echo "::error::a download or install failed"; exit 1; }

      - name: Name the build
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          USE_ALT_NAME: ${{ inputs.use_alt_name }}
        run: |
          set -eo pipefail

          FILE="${IPA_URL##*/}"; FILE="${FILE%%[?#]*}"
          PREFIX=Vitrine
          SPOT_VERSION=""
          if [[ "$FILE" =~ ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            SPOT_VERSION="${BASH_REMATCH[1]}"
            PREFIX=TestFlight-Vitrine
            echo "found testflight version in the file name: $SPOT_VERSION"
          elif [ "$USE_ALT_NAME" = "true" ]; then
            PREFIX=TestFlight-Vitrine
          fi

          APP_DIR="$(unzip -Z1 ipa/spotify.ipa | grep -oE '^Payload/[^/]+\.app/' | sort -u | head -1)"
          [ -n "$APP_DIR" ] || { echo "::error::no Payload/*.app in the IPA"; exit 1; }
          unzip -p ipa/spotify.ipa "${APP_DIR}Info.plist" > "$RUNNER_TEMP/Info.plist"
          [ -n "$SPOT_VERSION" ] || SPOT_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/Info.plist")"

          MOD_VERSION="$(cat version.txt 2>/dev/null || true)"
          : "${MOD_VERSION:=0.0.0}"

          OUT="$GITHUB_WORKSPACE/out/${PREFIX}-${SPOT_VERSION}-v${MOD_VERSION}.ipa"
          {
            echo "FILE_PREFIX=$PREFIX"
            echo "SPOTIFY_VERSION=$SPOT_VERSION"
            echo "MOD_VERSION=$MOD_VERSION"
            echo "TIMESTAMP=$(date -u +'%Y-%m-%d-%H-%M-%S')"
            echo "OUT_IPA=$OUT"
            echo "PATCHED_IPA=${OUT%.ipa}-patched.ipa"
          } >> "$GITHUB_ENV"

      - name: Build
        run: ./scripts/pipeline.sh ipa/spotify.ipa --no-flex -o "$OUT_IPA"

      - name: Make the patched IPA
        run: |
          set -eo pipefail
          cp "$OUT_IPA" "$PATCHED_IPA"
          ipapatch --input "$PATCHED_IPA" --inplace --noconfirm

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine-ipas
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the release description
        if: inputs.upload_release
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          {
            printf '**Vitrine %s** on **Spotify %s**\n\n' "$MOD_VERSION" "$SPOTIFY_VERSION"
            printf -- '- `%s`: for SideStore, Feather or any certificate signer\n' "$(basename "$OUT_IPA")"
            printf -- '- `%s`: patched with ipapatch, for a paid developer certificate\n\n' "$(basename "$PATCHED_IPA")"
            printf 'Built from %s.\n' "$GITHUB_SHA"
            [ -z "$NOTES" ] || printf '\n%s\n' "$NOTES"
          } > release-body.md
          cat release-body.md

      - name: Publish the GitHub release
        if: inputs.upload_release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ipa-${{ env.MOD_VERSION }}-${{ env.TIMESTAMP }}
          name: ${{ env.FILE_PREFIX }} v${{ env.MOD_VERSION }} // Spotify ${{ env.SPOTIFY_VERSION }} // Build ${{ env.TIMESTAMP }}
          body_path: release-body.md
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: out/*.ipa
